server {
    listen 80;
    server_name doorbellinternationalschool.com www.doorbellinternationalschool.com 144.126.202.113;
    server_tokens off;

    client_max_body_size 8m;

    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|git|svn|sql|bak|map|old)$ {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noai, noimageai" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
